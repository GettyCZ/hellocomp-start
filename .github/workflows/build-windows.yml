name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt

      - name: Build single EXE with PyInstaller
        shell: cmd
        run: |
          pyinstaller --noconfirm --windowed --onefile ^
            --name "HelloComp_Start" ^
            --icon "assets\hellocomp_icon.ico" ^
            --add-data "assets;assets" ^
            main.py

      - name: Create ZIP package
        shell: powershell
        run: |
          Compress-Archive -Path "dist\HelloComp_Start.exe" -DestinationPath "HelloComp_Start_Windows_OneFile.zip"

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: HelloComp_Start_EXE
          path: dist/HelloComp_Start.exe

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: HelloComp_Start_Windows_OneFile
          path: HelloComp_Start_Windows_OneFile.zip
