name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt

      - name: Read app version
        shell: powershell
        run: |
          $json = Get-Content version.json -Raw | ConvertFrom-Json
          "APP_VERSION=$($json.version)" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "App version: $($json.version)"

      - name: Build single EXE with PyInstaller
        shell: cmd
        run: |
          pyinstaller --noconfirm --windowed --onefile ^
            --name "HelloComp_Start" ^
            --icon "assets\hellocomp_icon.ico" ^
            --add-data "assets;assets" ^
            main.py

      - name: Create ZIP package
        shell: powershell
        run: |
          Compress-Archive -Path "dist\HelloComp_Start.exe" -DestinationPath "HelloComp_Start_Windows_OneFile.zip"

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: HelloComp_Start_EXE
          path: dist/HelloComp_Start.exe

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: HelloComp_Start_Windows_OneFile
          path: HelloComp_Start_Windows_OneFile.zip

      - name: Publish release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:APP_VERSION"
          $repo = "${{ github.repository }}"
          $title = "HelloComp Start $env:APP_VERSION"
          $notes = "Automatická aktualizace aplikace HelloComp Start."

          echo "Publishing release $tag to $repo"

          gh release view $tag --repo $repo
          if ($LASTEXITCODE -eq 0) {
            echo "Release exists, uploading assets with clobber..."
            gh release upload $tag "dist\HelloComp_Start.exe" "version.json" --repo $repo --clobber
          } else {
            echo "Release does not exist, creating..."
            gh release create $tag "dist\HelloComp_Start.exe" "version.json" --repo $repo --title $title --notes $notes
          }
