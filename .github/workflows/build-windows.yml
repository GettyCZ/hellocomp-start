name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt

      - name: Read app version
        shell: powershell
        run: |
          $json = Get-Content version.json -Raw | ConvertFrom-Json
          "APP_VERSION=$($json.version)" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "App version: $($json.version)"

      - name: Build single EXE with PyInstaller
        shell: cmd
        run: |
          pyinstaller --noconfirm --windowed --onefile ^
            --name "HelloComp_Start" ^
            --icon "assets\hellocomp_icon.ico" ^
            --add-data "assets;assets" ^
            main.py

      - name: Create ZIP package
        shell: powershell
        run: |
          Compress-Archive -Path "dist\HelloComp_Start.exe" -DestinationPath "HelloComp_Start_Windows_OneFile.zip"

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: HelloComp_Start_EXE
          path: dist/HelloComp_Start.exe

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: HelloComp_Start_Windows_OneFile
          path: HelloComp_Start_Windows_OneFile.zip

      - name: Initialize public update repository
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.UPDATE_REPO_TOKEN }}
        run: |
          $repo = "GettyCZ/hellocomp-start-updates"

          echo "Checking if $repo is initialized..."

          gh api "repos/$repo/contents/README.md" --silent
          if ($LASTEXITCODE -eq 0) {
            echo "Update repository already initialized."
            exit 0
          }

          echo "README.md not found, creating initial file..."

          $content = "# HelloComp Start Updates`n`nPublic update repository for HelloComp Start application releases."
          $bytes = [System.Text.Encoding]::UTF8.GetBytes($content)
          $base64 = [System.Convert]::ToBase64String($bytes)

          $body = @{
            message = "Initialize update repository"
            content = $base64
          } | ConvertTo-Json

          $body | gh api "repos/$repo/contents/README.md" --method PUT --input -

          echo "Update repository initialized."

      - name: Publish update release
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.UPDATE_REPO_TOKEN }}
        run: |
          $tag = "v$env:APP_VERSION"
          $repo = "GettyCZ/hellocomp-start-updates"
          $title = "HelloComp Start $env:APP_VERSION"
          $notes = "Automatická aktualizace aplikace HelloComp Start."

          echo "Publishing update release $tag to $repo"

          gh release view $tag --repo $repo
          if ($LASTEXITCODE -eq 0) {
            echo "Release exists, uploading assets with clobber..."
            gh release upload $tag "dist\HelloComp_Start.exe" "version.json" --repo $repo --clobber
          } else {
            echo "Release does not exist, creating..."
            gh release create $tag "dist\HelloComp_Start.exe" "version.json" --repo $repo --title $title --notes $notes
          }
